services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache git &&
             rm -rf /tmp/repo &&
             git clone --depth=1 https://github.com/World2576/churrasqueando-ferrari-store.git /tmp/repo &&
             rm -rf /usr/share/nginx/html/* &&
             cp -r /tmp/repo/* /usr/share/nginx/html/ &&
             echo 'server { listen 80; root /usr/share/nginx/html; index index.html; port_in_redirect off; absolute_redirect off; location / { try_files \$$uri \$$uri/ /index.html; } }' > /etc/nginx/conf.d/default.conf &&
             (while true; do sleep 300; cd /tmp/repo && git pull && cp -r /tmp/repo/* /usr/share/nginx/html/; done) &
             nginx -g 'daemon off;'"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.testechurrasqueando.rule=Host(`testechurrasqueando.emmovimento.tech`)"
      - "traefik.http.routers.testechurrasqueando.entrypoints=websecure"
      - "traefik.http.routers.testechurrasqueando.tls=true"
      - "traefik.http.routers.testechurrasqueando.tls.certresolver=letsencrypt"
      - "traefik.http.services.testechurrasqueando.loadbalancer.server.port=80"
